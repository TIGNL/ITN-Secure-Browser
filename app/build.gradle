plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.itn.securebrowser'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.itn.securebrowser"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "2.0-compose"
    }

    flavorDimensions += 'design'

    productFlavors {
        create('full') {
            dimension 'design'
            applicationIdSuffix '.full'
            resValue 'string', 'app_name', 'ITN Browser - Full'
            buildConfigField 'String', 'DESIGN_VARIANT', '"full"'
        }
        create('faithful') {
            dimension 'design'
            applicationIdSuffix '.faithful'
            resValue 'string', 'app_name', 'ITN Browser - Faithful'
            buildConfigField 'String', 'DESIGN_VARIANT', '"faithful"'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
        resValues = true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.11.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.1'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
