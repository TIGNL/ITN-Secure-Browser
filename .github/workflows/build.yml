name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        continue-on-error: true
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/itn-release.jks

      - name: Build Release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/itn-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }} \
            2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log to repo on failure
        if: failure()
        run: |
          SHA=$(git rev-parse --short HEAD)
          LOG_PATH="build-logs/${SHA}.log"
          CONTENT=$(base64 -w 0 build.log)
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/$LOG_PATH" \
            -d "{\"message\":\"ci: build log for ${SHA}\",\"content\":\"${CONTENT}\"}"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

